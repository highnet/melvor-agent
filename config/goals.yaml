# Terminal goals. You edit this file; the planner resolves prerequisites and
# picks what is reachable now. Goals are a DAG, not a list.
#
# Not yet read by any Phase 1 code path — the planner stub selects on XP/hr
# alone. Committed now so the shape is settled before the model is wired in.

goals:
  - id: woodcutting-60
    description: Woodcutting to level 60
    requires: []
    success:
      - type: skill_level_at_least
        skillId: melvorD:Woodcutting
        level: 60

  - id: bank-expansion-fund
    description: Bank 50k GP for early bank slots
    requires: [woodcutting-60]
    success:
      - type: currency_at_least
        currencyId: melvorD:GP
        amount: 50000

# Caps that apply regardless of goal.
budgets:
  # Refuse to spend below this GP floor.
  gpFloor: 1000
  # Daily planner token budget. Phase 2.
  dailyTokens: 200000
