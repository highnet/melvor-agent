name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Opens (and keeps updating) a release PR that bumps the version and
      # writes CHANGELOG.md from Conventional Commits. Merging that PR tags the
      # release. Publishing to mod.io stays a local `pnpm release` — the token
      # is a personal one and does not belong in repository secrets for a
      # single-user tool.
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
